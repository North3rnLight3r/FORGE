name: FORGE coordinated release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run verify:release-version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: forge-linux-${{ github.sha }}
          path: dist_electron/
          if-no-files-found: error

  package-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm run package:macos
      - run: shasum -a 256 dist_electron/FORGE-* > dist_electron/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: forge-macos-${{ github.sha }}
          path: dist_electron/
          if-no-files-found: error

  package-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm run package:windows
      - shell: pwsh
        run: Get-ChildItem dist_electron -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content dist_electron/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: forge-windows-${{ github.sha }}
          path: dist_electron/
          if-no-files-found: error

  publish:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/tags/v2.5.0-beta') || github.event_name == 'workflow_dispatch' }}
    needs: [package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { pattern: forge-*, path: release-assets }
      - name: Verify tag and publish complete release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          release_tag='v2.5.0-beta'
          upload_directory="$RUNNER_TEMP/forge-release-upload"
          mkdir -p "$upload_directory"
          declare -A names=()
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            if [[ -n "${names[$name]+present}" ]]; then
              echo "Duplicate cross-platform release asset: $name" >&2
              exit 1
            fi
            names[$name]=1
            cp "$asset" "$upload_directory/$name"
          done < <(find release-assets -mindepth 2 -maxdepth 2 -type f ! -name build-manifest.json ! -name SHA256SUMS ! -name builder-debug.yml ! -name builder-effective-config.yaml -print | sort)
          mapfile -t assets < <(find "$upload_directory" -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 8
          (cd "$upload_directory" && sha256sum * > SHA256SUMS.all)
          assets+=("$upload_directory/SHA256SUMS.all")
          gh release create "$release_tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "FORGE 2.5.0-beta" --notes-file RELEASE_NOTES.md --prerelease
